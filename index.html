<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>猪屎快跑：最终舒缓版</title>
    <style>
        body { margin: 0; overflow: hidden; background: #87CEEB; font-family: 'Microsoft YaHei', sans-serif; touch-action: none; user-select: none; }
        canvas { display: block; width: 100%; height: 100%; }
        
        #ui-layer {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;
            display: flex; flex-direction: column; align-items: center;
        }
        
        .hud { margin-top: 20px; text-align: center; }
        .score-pill {
            background: rgba(255,255,255,0.95); padding: 10px 25px; border-radius: 30px;
            font-size: 20px; font-weight: 800; color: #FF6B6B;
            box-shadow: 0 4px 15px rgba(255,107,107,0.3); display: inline-block;
            border: 2px solid white;
        }

        .modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 25px;
            text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,0.15); pointer-events: auto;
            border: 4px solid #fff; width: 85%; max-width: 320px;
        }
        .btn-start {
            background: linear-gradient(to bottom, #FF8E8E, #FF6B6B); color: white; border: none; padding: 15px 40px;
            font-size: 20px; border-radius: 50px; cursor: pointer; font-weight: bold;
            margin-top: 20px; transition: 0.1s; box-shadow: 0 6px 0 #D63031; width: 100%;
        }
        .btn-start:active { transform: translateY(6px); box-shadow: none; }
        
        #warehouse {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #FFF0F5; z-index: 100; pointer-events: auto;
            flex-direction: column; align-items: center; justify-content: center;
        }
        .gift-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 20px;
        }
        .gift-box {
            width: 130px; height: 130px; background: white; border-radius: 20px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05); cursor: pointer; border: 4px solid #f0f0f0;
            transition: 0.3s;
        }
        .gift-emoji { font-size: 45px; margin-bottom: 5px; transition: 0.3s; }
        .gift-text { font-size: 14px; color: #ccc; font-weight: bold; padding: 0 5px; text-align: center; }
        .gift-box.opened { border-color: #FF6B6B; background: #FFF0F0; transform: scale(1.05); }
        .gift-box.opened .gift-text { color: #FF6B6B; }
    </style>
</head>
<body>

    <canvas id="gameCanvas"></canvas>

    <div id="ui-layer">
        <div class="hud">
            <div class="score-pill">🎁 收集进度: <span id="scoreVal">0</span> / 4</div>
        </div>

        <div id="startScreen" class="modal">
            <h1 style="color:#FF6B6B; margin:0 0 5px 0;">🐷 猪屎快跑</h1>
            <p style="color:#636e72; font-size:15px; line-height: 1.6;">
                速度放慢了，放心跑！<br>
                遇到坑一定要跳过去哦~<br>
                礼物后面是绝对安全的！
            </p>
            <button class="btn-start" onclick="startGame()">开始漫步</button>
        </div>
    </div>

    <div id="warehouse">
        <h1 style="color:#FF6B6B;">🎉 挑战成功！</h1>
        <p style="color:#888;">快拆开属于你的礼物吧</p>
        <div class="gift-grid">
            <div class="gift-box" onclick="openGift(this, 'SF-111-222')">
                <div class="gift-emoji">📦</div><div class="gift-text">点我拆开</div>
            </div>
            <div class="gift-box" onclick="openGift(this, 'YT-333-444')">
                <div class="gift-emoji">📦</div><div class="gift-text">点我拆开</div>
            </div>
            <div class="gift-box" onclick="openGift(this, 'ZT-555-666')">
                <div class="gift-emoji">📦</div><div class="gift-text">点我拆开</div>
            </div>
            <div class="gift-box" onclick="openGift(this, 'EMS-777-888')">
                <div class="gift-emoji">📦</div><div class="gift-text">点我拆开</div>
            </div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // --- 核心物理参数 (舒缓版) ---
        // 速度改为原来的 2/3 (之前是3.0 -> 2.0)
        const INITIAL_SPEED = 2.0;  
        const MAX_SPEED = 3.5;
        
        // 物理手感
        const GRAVITY = 0.12;       // 极低重力 (漂浮感)
        const JUMP_FORCE = 8.5;     // 起跳力度
        
        const GIFT_INTERVAL = 8000; 
        const OBSTACLE_GAP = 550;   
        const PIT_WIDTH = 130;      // 坑的宽度

        let width, height, groundY;
        let isPlaying = false;
        let score = 0;
        let frame = 0;
        let gameSpeed = INITIAL_SPEED;
        let animationId = null;
        let lastGiftTime = 0;
        let spawnBlockTimer = 0;

        // SVG 角色资源 (拟人化站立版)
        const pigImg = new Image();
        pigImg.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='%23FFB6C1'%3E%3Crect x='35' y='40' width='30' height='35' rx='10' ry='10'/%3E%3Cellipse cx='50' cy='35' rx='25' ry='20'/%3E%3Cpath d='M30,25 Q20,10 35,15' stroke='%23FF69B4' stroke-width='2'/%3E%3Cpath d='M70,25 Q80,10 65,15' stroke='%23FF69B4' stroke-width='2'/%3E%3Cellipse cx='50' cy='38' rx='8' ry='6' fill='%23FF69B4'/%3E%3Ccircle cx='46' cy='38' r='2' fill='black'/%3E%3Ccircle cx='54' cy='38' r='2' fill='black'/%3E%3Ccircle cx='42' cy='30' r='3' fill='black'/%3E%3Ccircle cx='58' cy='30' r='3' fill='black'/%3E%3Ccircle cx='35' cy='55' r='8' fill='%23FF69B4'/%3E%3Ccircle cx='65' cy='55' r='8' fill='%23FF69B4'/%3E%3Ccircle cx='40' cy='80' r='8' fill='%23FF69B4'/%3E%3Ccircle cx='60' cy='85' r='8' fill='%23FF69B4'/%3E%3C/g%3E%3C/svg%3E";

        const dogImg = new Image();
        dogImg.src = "data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cg fill='%23D2691E'%3E%3Crect x='35' y='40' width='30' height='35' rx='5' ry='5'/%3E%3Ccircle cx='50' cy='35' r='20'/%3E%3Cellipse cx='25' cy='30' rx='8' ry='15' fill='%238B4513' transform='rotate(-20 25 30)'/%3E%3Cellipse cx='75' cy='30' rx='8' ry='15' fill='%238B4513' transform='rotate(20 75 30)'/%3E%3Ccircle cx='43' cy='32' r='3' fill='black'/%3E%3Ccircle cx='57' cy='32' r='3' fill='black'/%3E%3Cpath d='M45,42 Q50,47 55,42' stroke='black' fill='none' stroke-width='2'/%3E%3Ccircle cx='50' cy='38' r='4' fill='black'/%3E%3Ccircle cx='32' cy='55' r='8' fill='%238B4513'/%3E%3Ccircle cx='68' cy='55' r='8' fill='%238B4513'/%3E%3Ccircle cx='40' cy='85' r='8' fill='%238B4513'/%3E%3Ccircle cx='60' cy='80' r='8' fill='%238B4513'/%3E%3C/g%3E%3C/svg%3E";

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            groundY = height * 0.75;
        }
        window.addEventListener('resize', resize);
        resize();

        class Pig {
            constructor() {
                this.size = 80;
                this.x = width * 0.2;
                this.y = groundY - this.size;
                this.vy = 0;
                this.grounded = true;
            }
            jump() {
                if (this.grounded) {
                    this.vy = -JUMP_FORCE; 
                    this.grounded = false;
                }
            }
            update() {
                this.vy += GRAVITY;
                this.y += this.vy;
                
                // 🛑 修复：精准的掉坑判定逻辑
                let onSolidGround = false;
                let pigCenterX = this.x + this.size / 2;
                let overPit = false;

                for(let pit of pits) {
                    // 如果重心在坑的范围内
                    if (pigCenterX > pit.x && pigCenterX < pit.x + pit.w) {
                        overPit = true;
                        break;
                    }
                }

                if (overPit) {
                    // 在坑上面，没有地面支撑，持续下落
                    onSolidGround = false;
                } else {
                    // 不在坑上面，有地面
                    onSolidGround = true;
                }

                // 地面碰撞逻辑
                if (onSolidGround) {
                    if (this.y > groundY - this.size) {
                        this.y = groundY - this.size;
                        this.vy = 0;
                        this.grounded = true;
                    }
                } else {
                    this.grounded = false; // 在坑上方无法跳跃
                }
                
                // 掉出屏幕底部判定死亡
                if (this.y > height + 50) gameOver();
            }
            draw() {
                ctx.save();
                ctx.translate(Math.round(this.x), Math.round(this.y));
                // 🛑 修复：动画速度减半 (frame * 0.1)
                let bounce = this.grounded ? Math.sin(frame * 0.1) * 5 : 0;
                ctx.drawImage(pigImg, 0, Math.round(-bounce), this.size, this.size);
                ctx.restore();
            }
        }

        class Dog {
            constructor() {
                this.size = 80;
                this.x = width * 0.02;
                this.y = groundY - this.size;
                this.whipAngle = 0;
            }
            update() {
                this.y = groundY - this.size;
                this.whipAngle = Math.sin(frame * 0.08) * 0.5; // 变慢
            }
            draw() {
                ctx.save();
                ctx.translate(Math.round(this.x), Math.round(this.y));
                let bounce = Math.sin(frame * 0.1 + 0.5) * 5; // 变慢
                
                // 鞭子
                ctx.save();
                ctx.translate(this.size * 0.7, this.size * 0.6 - bounce);
                ctx.rotate(this.whipAngle - 0.3);
                ctx.strokeStyle = '#8B4513'; ctx.lineWidth = 5;
                ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(20, -30); ctx.stroke(); 
                ctx.strokeStyle = '#5d4037'; ctx.lineWidth = 3;
                ctx.beginPath(); ctx.moveTo(20, -30);
                ctx.quadraticCurveTo(40 + Math.cos(frame*0.1)*15, -50, 60, -10 + Math.sin(frame*0.1)*15); 
                ctx.stroke();
                ctx.restore();

                ctx.drawImage(dogImg, 0, Math.round(-bounce), this.size, this.size);
                ctx.restore();
            }
        }

        let obstacles = []; let pits = []; let gifts = []; let clouds = [];

        function initBg() {
            clouds = [];
            for(let i=0; i<5; i++) clouds.push({x: Math.random()*width, y: Math.random()*height*0.3, speed: 0.1 + Math.random()*0.2, scale: 0.6+Math.random()*0.4});
        }

        function spawnLogic() {
            if (spawnBlockTimer > 0) {
                spawnBlockTimer--;
                return;
            }

            let lastX = 0;
            if (obstacles.length > 0) lastX = Math.max(lastX, obstacles[obstacles.length-1].x);
            if (pits.length > 0) lastX = Math.max(lastX, pits[pits.length-1].x);
            if (gifts.length > 0) lastX = Math.max(lastX, gifts[gifts.length-1].x);

            // 障碍生成
            if (width - lastX > OBSTACLE_GAP) {
                let rand = Math.random();
                if (rand < 0.2) { 
                    pits.push({ x: width, w: PIT_WIDTH }); 
                } 
                else if (rand < 0.5) {
                    obstacles.push({ x: width, y: groundY - 70, w: 50, h: 70, color: '#66BB6A' });
                }
            }

            // 礼物生成
            let now = Date.now();
            if (score < 4 && (now - lastGiftTime > GIFT_INTERVAL)) {
                if (width - lastX > 300) {
                    gifts.push({ 
                        x: width, 
                        y: groundY - 240, 
                        w: 55, h: 55, angle: 0 
                    });
                    lastGiftTime = now;
                    spawnBlockTimer = 200; // 安全期保护
                }
            }
        }

        let pig, dog;
        function startGame() {
            if (animationId) cancelAnimationFrame(animationId);
            document.getElementById('startScreen').style.display = 'none';
            score = 0; document.getElementById('scoreVal').innerText = score;
            gameSpeed = INITIAL_SPEED;
            obstacles = []; pits = []; gifts = [];
            spawnBlockTimer = 0;
            pig = new Pig(); dog = new Dog();
            initBg(); resize(); lastGiftTime = Date.now();
            isPlaying = true; loop();
        }

        function loop() {
            if (!isPlaying) return;
            ctx.clearRect(0, 0, width, height);
            
            // 天空
            let grad = ctx.createLinearGradient(0, 0, 0, height);
            grad.addColorStop(0, "#87CEEB"); grad.addColorStop(1, "#B0E0E6");
            ctx.fillStyle = grad; ctx.fillRect(0, 0, width, height);

            // 大标题
            ctx.save();
            ctx.font = "bold italic 50px 'Microsoft YaHei'";
            ctx.fillStyle = "rgba(255, 255, 255, 0.4)";
            ctx.textAlign = "center";
            ctx.fillText("猪屎快跑", width / 2, height * 0.2);
            ctx.restore();

            // 云
            ctx.fillStyle = "rgba(255,255,255,0.7)";
            clouds.forEach(c => {
                c.x -= c.speed; if(c.x < -200) c.x = width + 200;
                ctx.beginPath(); ctx.arc(c.x, c.y, 40*c.scale, 0, Math.PI*2); ctx.arc(c.x+30*c.scale, c.y-20*c.scale, 50*c.scale, 0, Math.PI*2); ctx.fill();
            });

            // 地面与坑
            // 先画整个地面
            ctx.fillStyle = "#8BC34A"; ctx.fillRect(0, groundY, width, height - groundY);
            ctx.fillStyle = "#689F38"; ctx.fillRect(0, groundY, width, 20);
            
            // 再把坑“挖”出来 (用天空色覆盖)
            pits.forEach((p, index) => {
                p.x -= gameSpeed;
                ctx.fillStyle = "#B0E0E6"; // 必须和天空下半部分颜色一致
                ctx.fillRect(Math.round(p.x), groundY, p.w, height - groundY);
                
                // 简单的坑边缘立体感
                ctx.fillStyle = "#558B2F";
                ctx.fillRect(Math.round(p.x), groundY, 10, height-groundY); // 左壁
                ctx.fillRect(Math.round(p.x+p.w-10), groundY, 10, height-groundY); // 右壁

                if (p.x + p.w < -100) pits.splice(index, 1);
            });

            spawnLogic();

            // 障碍物
            for (let i = obstacles.length - 1; i >= 0; i--) {
                let obs = obstacles[i]; obs.x -= gameSpeed;
                ctx.fillStyle = obs.color;
                ctx.beginPath(); ctx.roundRect(Math.round(obs.x), obs.y, obs.w, obs.h, 20); ctx.fill();
                ctx.fillStyle = "rgba(0,0,0,0.2)";
                ctx.fillRect(Math.round(obs.x+10), obs.y+15, 8, 8); ctx.fillRect(Math.round(obs.x+30), obs.y+40, 8, 8);
                
                if (pig.x + pig.size*0.7 > obs.x && pig.x + pig.size*0.3 < obs.x + obs.w && pig.y + pig.size*0.9 > obs.y) { gameOver(); }
                if (obs.x < -100) obstacles.splice(i, 1);
            }

            // 礼物
            for (let i = gifts.length - 1; i >= 0; i--) {
                let g = gifts[i]; g.x -= gameSpeed; g.angle = Math.sin(frame * 0.05) * 0.1;
                ctx.save(); ctx.translate(Math.round(g.x + g.w/2), Math.round(g.y + g.h/2)); ctx.rotate(g.angle);
                ctx.fillStyle = "#FF6B6B"; ctx.fillRect(-g.w/2, -g.h/2, g.w, g.h);
                ctx.fillStyle = "#FFD700"; ctx.fillRect(-g.w/2 + 18, -g.h/2, 15, g.h); ctx.fillRect(-g.w/2, -g.h/2 + 18, g.w, 15);
                ctx.restore();
                
                if (pig.x + pig.size > g.x && pig.x < g.x + g.w && pig.y < g.y + g.h && pig.y + pig.size > g.y) {
                    gifts.splice(i, 1); score++; document.getElementById('scoreVal').innerText = score;
                    if(gameSpeed < MAX_SPEED) gameSpeed += 0.1;
                    if (score >= 4) gameWin();
                }
                if (g.x < -100) gifts.splice(i, 1);
            }

            pig.update(); pig.draw();
            dog.update(); dog.draw();
            frame++; animationId = requestAnimationFrame(loop);
        }

        function gameOver() {
            isPlaying = false; cancelAnimationFrame(animationId);
            setTimeout(() => { alert("哎呀掉下去了！\n没事，再来一次~"); startGame(); }, 100);
        }
        function gameWin() {
            isPlaying = false; cancelAnimationFrame(animationId);
            document.getElementById('ui-layer').style.display = 'none'; canvas.style.display = 'none';
            document.getElementById('warehouse').style.display = 'flex';
        }
        function jumpAction(e) {
            if(e.type === 'keydown' && e.code !== 'Space') return;
            if(!isPlaying) return; pig.jump();
        }
        window.addEventListener('touchstart', (e) => { e.preventDefault(); jumpAction(e); }, {passive: false});
        window.addEventListener('mousedown', jumpAction); window.addEventListener('keydown', jumpAction);
        window.openGift = function(el, code) {
            if(el.classList.contains('opened')) return; el.classList.add('opened');
            el.querySelector('.gift-emoji').innerHTML = '🎁<br>✨'; el.querySelector('.gift-text').innerText = code;
        }
    </script>
</body>
</html>
