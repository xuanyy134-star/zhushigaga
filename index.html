<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>炫酷粒子交互背景</title>
    <style>
        body {
            margin: 0;
            overflow: hidden; /* 防止滚动条 */
            background-color: #1a1a2e; /* 深色背景 */
            font-family: 'Arial', sans-serif;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        canvas {
            display: block; /* 消除canvas下面的额外空间 */
            position: absolute; /* 让canvas覆盖整个背景 */
            top: 0;
            left: 0;
            z-index: -1; /* 确保粒子在内容之下 */
        }
        .content {
            z-index: 1; /* 内容在粒子之上 */
            text-align: center;
            padding: 20px;
            background: rgba(0, 0, 0, 0.4); /* 内容区域半透明背景 */
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.5);
        }
        h1 {
            font-size: 3em;
            margin-bottom: 10px;
            text-shadow: 0 0 10px #0ff, 0 0 20px #0ff; /* 霓虹效果 */
        }
        p {
            font-size: 1.2em;
            line-height: 1.6;
        }
    </style>
</head>
<body>

    <div class="content">
        <h1>欢迎来到粒子宇宙！</h1>
        <p>这是一个由HTML、CSS和JavaScript创建的炫酷交互背景。</p>
        <p>尝试移动鼠标，观察粒子的变化！</p>
    </div>

    <canvas id="particleCanvas"></canvas>

    <script>
        const canvas = document.getElementById('particleCanvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        let mouse = { x: null, y: null, radius: 150 }; // 鼠标作用范围

        // 设置canvas尺寸
        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', setCanvasSize);
        setCanvasSize();

        // 鼠标移动事件
        window.addEventListener('mousemove', function(event) {
            mouse.x = event.x;
            mouse.y = event.y;
        });

        // 鼠标离开屏幕，重置鼠标位置
        window.addEventListener('mouseout', function() {
            mouse.x = null;
            mouse.y = null;
        });

        // 粒子构造函数
        class Particle {
            constructor(x, y, directionX, directionY, size, color) {
                this.x = x;
                this.y = y;
                this.directionX = directionX;
                this.directionY = directionY;
                this.size = size;
                this.color = color;
            }

            // 绘制粒子
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.fill();
            }

            // 更新粒子位置和交互
            update() {
                // 边界检测
                if (this.x > canvas.width || this.x < 0) {
                    this.directionX = -this.directionX;
                }
                if (this.y > canvas.height || this.y < 0) {
                    this.directionY = -this.directionY;
                }

                this.x += this.directionX;
                this.y += this.directionY;

                // 鼠标交互
                if (mouse.x !== null && mouse.y !== null) {
                    let dx = mouse.x - this.x;
                    let dy = mouse.y - this.y;
                    let distance = Math.sqrt(dx*dx + dy*dy);

                    if (distance < mouse.radius + this.size) {
                        if (mouse.x < this.x && this.x < canvas.width - this.size * 10) {
                            this.x += 1;
                        }
                        if (mouse.x > this.x && this.x > this.size * 10) {
                            this.x -= 1;
                        }
                        if (mouse.y < this.y && this.y < canvas.height - this.size * 10) {
                            this.y += 1;
                        }
                        if (mouse.y > this.y && this.y > this.size * 10) {
                            this.y -= 1;
                        }
                    }
                }
                this.draw();
            }
        }

        // 初始化粒子
        function init() {
            particles = [];
            let numberOfParticles = (canvas.width * canvas.height) / 9000; // 根据屏幕大小调整粒子数量
            for (let i = 0; i < numberOfParticles; i++) {
                let size = (Math.random() * 5) + 1; // 1到6之间
                let x = (Math.random() * ((innerWidth - size * 2) - (size * 2)) + size * 2);
                let y = (Math.random() * ((innerHeight - size * 2) - (size * 2)) + size * 2);
                let directionX = (Math.random() * 0.5) - 0.25; // -0.25到0.25
                let directionY = (Math.random() * 0.5) - 0.25; // -0.25到0.25
                let color = 'rgba(0, 255, 255, 0.8)'; // 青色
                particles.push(new Particle(x, y, directionX, directionY, size, color));
            }
        }

        // 动画循环
        function animate() {
            requestAnimationFrame(animate);
            ctx.clearRect(0, 0, innerWidth, innerHeight); // 清空画布

            for (let i = 0; i < particles.length; i++) {
                particles[i].update();
            }
            connect();
        }

        // 连接粒子
        function connect() {
            let opacityValue = 1;
            for (let a = 0; a < particles.length; a++) {
                for (let b = a; b < particles.length; b++) {
                    let distance = ((particles[a].x - particles[b].x) * (particles[a].x - particles[b].x)) +
                                   ((particles[a].y - particles[b].y) * (particles[a].y - particles[b].y));
                    if (distance < (canvas.width/7) * (canvas.height/7)) { // 距离小于某个值时连线
                        opacityValue = 1 - (distance / 20000); // 距离越远，透明度越低
                        ctx.strokeStyle = 'rgba(0, 255, 255,' + opacityValue + ')';
                        ctx.lineWidth = 1;
                        ctx.beginPath();
                        ctx.moveTo(particles[a].x, particles[a].y);
                        ctx.lineTo(particles[b].x, particles[b].y);
                        ctx.stroke();
                    }
                }
            }
        }

        init();
        animate();
    </script>
</body>
</html>
